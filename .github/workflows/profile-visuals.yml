name: Update Profile Visuals

on:
  schedule:
    # Runs at 00:00 UTC daily
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📊 Refresh Stats SVGs
        run: |
          mkdir -p assets
          curl -s -f --max-time 15 "https://github-stats-extended.vercel.app/api?username=coder-manthan-007&show_icons=true&theme=radical&hide_border=true&title_color=fe428e&icon_color=6a3093&text_color=ffffff&bg_color=141321" -o assets/github-stats.svg || echo "Stats fetch fallback"
          curl -s -f --max-time 15 "https://github-stats-extended.vercel.app/api/top-langs/?username=coder-manthan-007&layout=compact&theme=radical&hide_border=true&title_color=fe428e&text_color=ffffff&bg_color=141321" -o assets/top-langs.svg || echo "Langs fetch fallback"

      - name: 🐍 Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: 🚀 Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ assets/
          if [ -d "profile-3d-contrib" ]; then
            git add profile-3d-contrib/
          fi
          git commit -m "chore(visuals): refresh contribution visuals & stats [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Nothing to push"
