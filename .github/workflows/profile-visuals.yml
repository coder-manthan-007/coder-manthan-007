name: Update Profile Visuals

on:
  schedule:
    # Runs at 00:00 UTC daily
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧊 Generate 3D calendar
        uses: yoshi389111/github-profile-3d-contrib@release/v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: 🚀 Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if [ -d "profile-3d-contrib" ]; then
            git add profile-3d-contrib/
          fi
          git commit -m "chore(visuals): update contribution snake & 3d calendar [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Nothing to push"
